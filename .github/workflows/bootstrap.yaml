name: Terraform S3 Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev, staging, prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  terraform-bootstrap:
    name: Bootstrap Terraform Backend
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: terraform -chdir=environments/${{ github.event.inputs.environment }} init

      - name: Extract AWS Region
        id: get_region
        working-directory: environments/${{ github.event.inputs.environment }}
        run: |
          REGION=$(grep '^region' terraform.tfvars | awk -F'=' '{print $2}' | tr -d ' "')
          echo "AWS_REGION=$REGION" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Validate
        run: terraform -chdir=environments/${{ github.event.inputs.environment }} validate

      - name: Terraform Plan
        run: terraform -chdir=environments/${{ github.event.inputs.environment }} plan -var-file="terraform.tfvars"

      - name: Terraform Apply
        run: terraform -chdir=environments/${{ github.event.inputs.environment }} apply -var-file="terraform.tfvars" -auto-approve
